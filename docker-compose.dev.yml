name: klyndre-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klyndre
    ports:
      - "127.0.0.1:9774:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klyndre"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
