services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-klyndre}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    restart: "no"
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-klyndre}

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      XAI_API_KEY: ${XAI_API_KEY:?}
      DP_SPOTIFY_CLIENT_ID: ${DP_SPOTIFY_CLIENT_ID}
      DP_SPOTIFY_CLIENT_SECRET: ${DP_SPOTIFY_CLIENT_SECRET}
      DEBUG_PLAYER: ${DEBUG_PLAYER:-false}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-klyndre}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-klyndre}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}

volumes:
  postgres-data:
